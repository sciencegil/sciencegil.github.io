<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소화계 기관 이름 맞히기 게임</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
    background: linear-gradient(135deg, #1a2a4a, #2c3e6b);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 10px;
  }
  h1 { font-size: 22px; margin: 8px 0; text-shadow: 0 2px 4px rgba(0,0,0,.4); }
  #hud {
    display: flex; gap: 14px; margin-bottom: 8px; flex-wrap: wrap; justify-content: center;
    background: rgba(255,255,255,.12); padding: 8px 20px; border-radius: 12px;
    font-size: 15px;
  }
  #hud b { color: #ffd54f; }
  #gameWrap {
    position: relative;
    width: 554px;
    max-width: 96vw;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
    background: #fff;
    user-select: none;
    touch-action: manipulation;
  }
  #board { position: relative; width: 100%; }
  #board svg { display: block; width: 100%; height: auto; }
  .organ { cursor: pointer; transition: filter .15s; }
  .organ:hover { filter: brightness(1.15) drop-shadow(0 0 6px #4fc3f7); }
  .organ.flash-ok { animation: okFlash .6s; }
  .organ.flash-bad { animation: badFlash .5s; }
  .organ.solved {
    cursor: default;
    pointer-events: none;
    filter: drop-shadow(0 0 6px #00c853);
  }
  .organ.solved path, .organ.solved circle, .organ.solved ellipse {
    fill: #a5d6a7 !important;
    stroke: #2e7d32 !important;
  }
  .organ.solved path[fill="none"] { fill: none !important; stroke: #66bb6a !important; }
  @keyframes okFlash { 0%,100%{filter:none} 50%{filter:drop-shadow(0 0 14px #00e676) brightness(1.4);} }
  @keyframes badFlash { 0%,100%{filter:none} 25%,75%{filter:drop-shadow(0 0 12px #ff5252) brightness(1.2);} }
  .falling {
    position: absolute;
    left: 0;
    padding: 6px 16px;
    background: #ff7043;
    color: #fff;
    font-size: 20px;
    font-weight: bold;
    border-radius: 20px;
    box-shadow: 0 3px 8px rgba(0,0,0,.35);
    white-space: nowrap;
    z-index: 5;
    pointer-events: none;
  }
  #overlay {
    position: absolute; inset: 0;
    background: rgba(15,25,50,.92);
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    gap: 14px; z-index: 10;
    text-align: center;
    padding: 20px;
    overflow-y: auto;
  }
  #overlay h2 { font-size: 26px; color: #ffd54f; }
  #overlay p { font-size: 15px; line-height: 1.7; }
  #overlay button {
    font-size: 18px; font-weight: bold;
    padding: 10px 32px; border: none; border-radius: 30px;
    background: #ffb300; color: #333; cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,.4);
  }
  #overlay button:hover { background: #ffca28; }
  #nickInput {
    font-size: 18px; padding: 10px 16px; border-radius: 10px;
    border: 2px solid #ffb300; outline: none; width: 240px; text-align: center;
  }
  #rankBox {
    width: 100%; max-width: 360px;
    background: rgba(255,255,255,.08);
    border-radius: 12px; padding: 12px;
    max-height: 240px; overflow-y: auto;
  }
  #rankBox h3 { color: #80d8ff; font-size: 17px; margin-bottom: 8px; }
  table.rank { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.rank th, table.rank td { padding: 5px 6px; border-bottom: 1px solid rgba(255,255,255,.15); }
  table.rank th { color: #ffd54f; }
  table.rank tr.me td { color: #69f0ae; font-weight: bold; }
  .medal { font-size: 15px; }
  #teacherLink {
    font-size: 12px; color: rgba(255,255,255,.45);
    cursor: pointer; text-decoration: underline; margin-top: 4px;
  }
  #teacherPanel {
    width: 100%; max-width: 380px;
    background: rgba(255,255,255,.1);
    border-radius: 12px; padding: 14px;
    text-align: left;
  }
  #teacherPanel h3 { color: #ff8a80; margin-bottom: 8px; font-size: 16px; }
  #teacherPanel .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  #teacherPanel button.small {
    font-size: 13px; padding: 6px 14px; border-radius: 8px;
    background: #ef5350; color: #fff;
  }
  #teacherPanel button.small:hover { background: #e57373; }
  #teacherPanel input, #teacherPanel select {
    font-size: 14px; padding: 6px 10px; border-radius: 8px; border: none; outline: none;
  }
  #msg {
    position: absolute; top: 44%; left: 50%; transform: translate(-50%,-50%);
    font-size: 30px; font-weight: bold; z-index: 8;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    text-shadow: 0 2px 6px rgba(0,0,0,.6);
  }
  #msg.show { opacity: 1; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<h1>🧪 소화계 기관 이름 맞히기</h1>
<div id="hud">
  <span>👤 <b id="hudNick">-</b></span>
  <span>점수: <b id="score">0</b></span>
  <span>생명: <b id="lives">❤❤❤</b></span>
  <span>오답: <b id="wrongCnt">0</b>/3</span>
  <span>단계: <b id="level">1</b></span>
  <span>남은 기관: <b id="remain">9</b></span>
</div>
<div id="gameWrap">
  <div id="board">
    <svg viewBox="0 0 554 953" xmlns="http://www.w3.org/2000/svg">
      <path d="M300 10 c70 0 110 45 112 100 c1 35 -8 60 -5 80 c3 18 15 28 15 28 l-25 20 c0 0 40 25 80 55 c45 34 60 80 62 140 l5 520 H10 l5 -430 c2 -70 20 -120 70 -155 c45 -31 95 -55 120 -65 c18 -8 25 -20 26 -45 c0 0 -18 -25 -20 -70 C208 70 235 10 300 10 Z" fill="#d9d9d9"/>
      <path d="M395 115 q25 10 18 35 q-8 20 -30 18 l-15 -8 q20 -25 27 -45Z" fill="#cfcfcf"/>

      <g id="org-esophagus" class="organ">
        <path d="M292 250 q-4 60 -2 130 q2 70 4 115 l22 0 q-4 -60 -4 -125 q0 -65 2 -120 Z" fill="#bdbdbd" stroke="#8d8d8d" stroke-width="2"/>
        <path d="M300 255 q-2 110 2 235" stroke="#a6a6a6" stroke-width="4" fill="none"/>
      </g>

      <g id="org-mouth" class="organ">
        <path d="M305 180 q45 -14 78 -6 q8 2 6 10 q-4 12 -40 16 q-36 4 -48 -6 q-4 -8 4 -14 Z" fill="#c9c9c9" stroke="#8d8d8d" stroke-width="2"/>
        <path d="M308 196 q40 10 72 -4" stroke="#8d8d8d" stroke-width="2.5" fill="none"/>
        <ellipse cx="345" cy="210" rx="30" ry="10" fill="#b5b5b5" stroke="#8d8d8d" stroke-width="2"/>
      </g>

      <g id="org-salivary" class="organ">
        <g stroke="#9e9e9e" stroke-width="1.5" fill="#e2e2e2">
          <circle cx="280" cy="150" r="9"/><circle cx="296" cy="142" r="9"/><circle cx="288" cy="162" r="9"/>
          <circle cx="303" cy="156" r="8"/><circle cx="274" cy="168" r="8"/><circle cx="292" cy="176" r="8"/>
          <circle cx="310" cy="230" r="7"/><circle cx="322" cy="236" r="7"/><circle cx="334" cy="230" r="7"/>
          <circle cx="316" cy="222" r="6"/><circle cx="328" cy="222" r="6"/>
        </g>
      </g>

      <g id="org-liver" class="organ">
        <path d="M150 530 q-10 -55 55 -70 q70 -16 120 -5 q35 8 40 40 q4 35 -12 72 q-14 32 -55 40 q-60 12 -105 -14 q-38 -22 -43 -63 Z" fill="#9a9a9a" stroke="#6f6f6f" stroke-width="2.5"/>
        <path d="M180 520 q50 18 95 10 M200 560 q40 14 80 4" stroke="#7d7d7d" stroke-width="3" fill="none"/>
      </g>

      <g id="org-stomach" class="organ">
        <path d="M330 495 q55 -12 85 18 q28 28 20 70 q-8 44 -50 62 q-45 20 -80 2 q-20 -10 -16 -32 q4 -20 28 -26 q35 -9 44 -36 q8 -26 -10 -42 q-14 -12 -21 -16 Z" fill="#e8e8e8" stroke="#9e9e9e" stroke-width="2.5"/>
        <path d="M345 510 q40 0 55 30" stroke="#bdbdbd" stroke-width="4" fill="none"/>
      </g>

      <g id="org-gallbladder" class="organ">
        <ellipse cx="233" cy="612" rx="20" ry="13" transform="rotate(-18 233 612)" fill="#8f8f8f" stroke="#666" stroke-width="2"/>
        <path d="M248 604 q14 -8 24 -4" stroke="#777" stroke-width="3" fill="none"/>
      </g>

      <g id="org-pancreas" class="organ">
        <path d="M250 640 q45 -22 95 -16 q30 4 38 16 q4 10 -10 14 q-45 10 -85 6 q-30 -4 -38 -20 Z" fill="#d4d4d4" stroke="#9a9a9a" stroke-width="2"/>
        <path d="M262 640 q50 -12 110 -4" stroke="#aaa" stroke-width="2.5" fill="none"/>
      </g>

      <!-- 큰창자 (항문 제외) -->
      <g id="org-largeint" class="organ">
        <path d="M160 700 q-2 -22 20 -24 l210 -8 q24 0 24 22 l4 130 q0 20 -18 22 M160 700 l-4 150 q0 18 14 22" fill="none" stroke="#c4c4c4" stroke-width="34" stroke-linecap="round"/>
        <g fill="#d6d6d6" stroke="#9e9e9e" stroke-width="1.5">
          <circle cx="178" cy="682" r="17"/><circle cx="212" cy="678" r="17"/><circle cx="246" cy="675" r="17"/><circle cx="280" cy="673" r="17"/><circle cx="314" cy="671" r="17"/><circle cx="348" cy="670" r="17"/><circle cx="382" cy="672" r="17"/><circle cx="405" cy="690" r="17"/>
          <circle cx="408" cy="722" r="17"/><circle cx="410" cy="756" r="17"/><circle cx="412" cy="790" r="17"/><circle cx="410" cy="824" r="17"/><circle cx="402" cy="852" r="17"/>
          <circle cx="160" cy="712" r="17"/><circle cx="158" cy="746" r="17"/><circle cx="157" cy="780" r="17"/><circle cx="156" cy="814" r="17"/><circle cx="158" cy="848" r="17"/><circle cx="170" cy="874" r="17"/>
        </g>
      </g>

      <!-- 항문 (게임 대상 아님, 큰창자와 분리) -->
      <g id="deco-anus">
        <path d="M275 880 q10 18 8 40 l16 0 q-2 -22 8 -40 Z" fill="#c0c0c0" stroke="#9e9e9e" stroke-width="2"/>
      </g>

      <g id="org-smallint" class="organ">
        <path d="M300 665 q-70 10 -90 50 q-18 40 20 55 q45 16 90 -5 q40 -20 20 -50 q-20 -28 -60 -10 q-45 20 -55 55 q-10 38 30 50 q50 14 95 -10 q35 -20 15 -50 q-18 -26 -58 -12 q-45 16 -58 50 q-12 36 25 50 q45 16 88 -5" fill="none" stroke="#e4e4e4" stroke-width="28" stroke-linecap="round"/>
        <path d="M300 665 q-70 10 -90 50 q-18 40 20 55 q45 16 90 -5 q40 -20 20 -50 q-20 -28 -60 -10 q-45 20 -55 55 q-10 38 30 50 q50 14 95 -10 q35 -20 15 -50 q-18 -26 -58 -12 q-45 16 -58 50 q-12 36 25 50 q45 16 88 -5" fill="none" stroke="#b8b8b8" stroke-width="2" stroke-linecap="round" opacity=".6"/>
      </g>
    </svg>
  </div>
  <div id="msg"></div>

  <!-- 시작/닉네임 화면 -->
  <div id="overlay">
    <h2>소화계 기관 이름 맞히기</h2>
    <p>화면 위에서 <b>기관의 이름</b>이 떨어집니다.<br>
       이름이 바닥에 닿기 전에 <b>소화계 그림에서 해당 기관</b>을 클릭하세요!<br><br>
       ✅ 빨리 맞힐수록 높은 점수 (1~5점) &nbsp; ❌ 오답 3번 = 생명 -1 &nbsp; 💔 바닥에 닿으면 생명 -1<br>
       한 단계에서 <b>9개 기관을 모두 맞히면</b> 다음 단계로! (단계가 오를수록 빨라져요)<br>
       정답을 맞힌 기관은 <b style="color:#a5d6a7">초록색</b>으로 바뀌고 다시 선택할 수 없어요.</p>
    <input id="nickInput" type="text" maxlength="10" placeholder="닉네임을 입력하세요 (최대 10자)">
    <button id="startBtn">게임 시작</button>
    <div id="rankBoxStart"></div>
    <span id="teacherLink">교사용 관리</span>
    <div id="teacherPanel" class="hidden">
      <h3>🔐 교사용 관리</h3>
      <div class="row" id="teacherLogin">
        <input id="teacherPw" type="password" placeholder="비밀번호" style="width:120px">
        <button class="small" id="teacherLoginBtn" style="background:#42a5f5">확인</button>
      </div>
      <div id="teacherTools" class="hidden">
        <div class="row">
          <select id="delNickSel" style="min-width:140px"></select>
          <button class="small" id="delNickBtn">해당 닉네임 기록 삭제</button>
        </div>
        <div class="row">
          <button class="small" id="resetAllBtn">전체 순위 초기화</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var ORGANS = [
    { id: 'org-mouth',       name: '입' },
    { id: 'org-salivary',    name: '침샘' },
    { id: 'org-esophagus',   name: '식도' },
    { id: 'org-liver',       name: '간' },
    { id: 'org-stomach',     name: '위' },
    { id: 'org-pancreas',    name: '이자' },
    { id: 'org-gallbladder', name: '쓸개' },
    { id: 'org-smallint',    name: '작은 창자' },
    { id: 'org-largeint',    name: '큰 창자' }
  ];

  var TEACHER_PW = '0517';
  var STORAGE_KEY = 'digestGameRanking';

  var wrap = document.getElementById('gameWrap');
  var overlay = document.getElementById('overlay');
  var startBtn = document.getElementById('startBtn');
  var nickInput = document.getElementById('nickInput');
  var scoreEl = document.getElementById('score');
  var livesEl = document.getElementById('lives');
  var levelEl = document.getElementById('level');
  var remainEl = document.getElementById('remain');
  var wrongEl = document.getElementById('wrongCnt');
  var hudNickEl = document.getElementById('hudNick');
  var msgEl = document.getElementById('msg');
  var rankBoxStart = document.getElementById('rankBoxStart');
  var teacherLink = document.getElementById('teacherLink');
  var teacherPanel = document.getElementById('teacherPanel');
  var teacherPw = document.getElementById('teacherPw');
  var teacherLoginBtn = document.getElementById('teacherLoginBtn');
  var teacherTools = document.getElementById('teacherTools');
  var delNickSel = document.getElementById('delNickSel');
  var delNickBtn = document.getElementById('delNickBtn');
  var resetAllBtn = document.getElementById('resetAllBtn');

  var nickname = '';
  var score = 0, lives = 3, level = 1, wrongCount = 0;
  var playing = false;
  var current = null;      // {organ, el, y, speed, spawnTime}
  var rafId = null;
  var lastTime = null;
  var msgTimer = null;
  var pendingOrgans = [];  // 이번 단계에서 아직 안 맞힌 기관들

  /* ---------- 순위 저장 ---------- */
  function loadRanking() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch(e) { return []; }
  }
  function saveRanking(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }
  function addRecord(nick, sc, lv) {
    var list = loadRanking();
    list.push({ nick: nick, score: sc, level: lv, time: Date.now() });
    list.sort(function(a,b){ return b.score - a.score || b.level - a.level || a.time - b.time; });
    if (list.length > 50) list = list.slice(0, 50);
    saveRanking(list);
  }
  function renderRanking(container, myTime) {
    var list = loadRanking();
    if (list.length === 0) {
      container.innerHTML = '<div id="rankBox"><h3>🏆 순위</h3><p style="font-size:14px">아직 기록이 없습니다.</p></div>';
      return;
    }
    var html = '<div id="rankBox"><h3>🏆 순위 (상위 10명)</h3><table class="rank"><tr><th>순위</th><th>닉네임</th><th>점수</th><th>단계</th></tr>';
    list.slice(0, 10).forEach(function(r, i) {
      var medal = i===0 ? '🥇' : i===1 ? '🥈' : i===2 ? '🥉' : (i+1);
      var cls = (myTime && r.time === myTime) ? ' class="me"' : '';
      html += '<tr'+cls+'><td class="medal">'+medal+'</td><td>'+escapeHtml(r.nick)+'</td><td>'+r.score+'점</td><td>'+r.level+'단계</td></tr>';
    });
    html += '</table></div>';
    container.innerHTML = html;
  }
  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ---------- 교사용 관리 ---------- */
  teacherLink.addEventListener('click', function(){
    teacherPanel.classList.toggle('hidden');
    teacherTools.classList.add('hidden');
    teacherPw.value = '';
  });
  teacherLoginBtn.addEventListener('click', function(){
    if (teacherPw.value === TEACHER_PW) {
      teacherTools.classList.remove('hidden');
      refreshDelSelect();
    } else {
      alert('비밀번호가 올바르지 않습니다.');
      teacherPw.value = '';
    }
  });
  function refreshDelSelect() {
    var list = loadRanking();
    var nicks = [];
    list.forEach(function(r){ if (nicks.indexOf(r.nick) < 0) nicks.push(r.nick); });
    delNickSel.innerHTML = nicks.length
      ? nicks.map(function(n){ return '<option value="'+escapeHtml(n)+'">'+escapeHtml(n)+'</option>'; }).join('')
      : '<option value="">기록 없음</option>';
  }
  delNickBtn.addEventListener('click', function(){
    var n = delNickSel.value;
    if (!n) return;
    if (!confirm('"' + n + '" 닉네임의 모든 기록을 삭제할까요?')) return;
    saveRanking(loadRanking().filter(function(r){ return r.nick !== n; }));
    refreshDelSelect();
    renderRanking(rankBoxStart);
    alert('삭제되었습니다.');
  });
  resetAllBtn.addEventListener('click', function(){
    if (!confirm('전체 순위를 초기화할까요? 되돌릴 수 없습니다.')) return;
    saveRanking([]);
    refreshDelSelect();
    renderRanking(rankBoxStart);
    alert('초기화되었습니다.');
  });

  /* ---------- HUD / 메시지 ---------- */
  function updateHud() {
    scoreEl.textContent = score;
    livesEl.textContent = lives > 0 ? '❤'.repeat(lives) : '-';
    levelEl.textContent = level;
    remainEl.textContent = pendingOrgans.length + (current ? 1 : 0);
    wrongEl.textContent = wrongCount;
    hudNickEl.textContent = nickname || '-';
  }
  function showMsg(text, color) {
    msgEl.textContent = text;
    msgEl.style.color = color;
    msgEl.classList.add('show');
    clearTimeout(msgTimer);
    msgTimer = setTimeout(function(){ msgEl.classList.remove('show'); }, 800);
  }

  /* ---------- 단계 / 출제 ---------- */
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function startLevel() {
    pendingOrgans = shuffle(ORGANS.slice());
    ORGANS.forEach(function(o){
      document.getElementById(o.id).classList.remove('solved');
    });
    updateHud();
  }
  function levelSpeed() {
    // 기본 속도 상향 + 단계마다 가파르게 증가
    return 70 + (level - 1) * 30 + Math.pow(level - 1, 2) * 6; // px/초
  }
  function spawnWord() {
    if (pendingOrgans.length === 0) return;
    var organ = pendingOrgans.shift();
    var el = document.createElement('div');
    el.className = 'falling';
    el.textContent = organ.name;
    wrap.appendChild(el);
    var w = el.offsetWidth;
    var maxX = wrap.clientWidth - w - 10;
    el.style.left = (10 + Math.random() * Math.max(10, maxX)) + 'px';
    current = { organ: organ, el: el, y: -40, speed: levelSpeed(), spawnTime: performance.now() };
    el.style.top = current.y + 'px';
    updateHud();
  }
  function removeWord() {
    if (current && current.el && current.el.parentNode) {
      current.el.parentNode.removeChild(current.el);
    }
    current = null;
  }
  function nextStep() {
    if (!playing) return;
    if (pendingOrgans.length === 0 && !current) {
      // 단계 완료!
      level++;
      showMsg('🎉 단계 완료! ' + level + '단계로!', '#ffd54f');
      setTimeout(function(){
        if (!playing) return;
        startLevel();
        spawnWord();
      }, 1100);
    } else {
      setTimeout(function(){ if (playing && !current) spawnWord(); }, 600);
    }
  }

  /* ---------- 루프 ---------- */
  function loop(ts) {
    if (!playing) return;
    if (lastTime === null) lastTime = ts;
    var dt = (ts - lastTime) / 1000;
    lastTime = ts;

    if (current) {
      current.y += current.speed * dt;
      current.el.style.top = current.y + 'px';
      if (current.y > wrap.clientHeight - 30) {
        lives--;
        showMsg('💔 놓쳤어요! 정답: ' + current.organ.name, '#ff8a80');
        flashOrgan(current.organ.id, 'flash-ok');
        // 놓친 기관은 다시 이번 단계 목록에 넣음 (모두 맞혀야 통과)
        pendingOrgans.push(current.organ);
        removeWord();
        updateHud();
        if (lives <= 0) { endGame(); return; }
        nextStep();
      }
    }
    rafId = requestAnimationFrame(loop);
  }

  function flashOrgan(id, cls) {
    var g = document.getElementById(id);
    if (!g) return;
    g.classList.remove('flash-ok', 'flash-bad');
    void g.getBoundingClientRect();
    g.classList.add(cls);
    setTimeout(function(){ g.classList.remove(cls); }, 650);
  }

  /* ---------- 점수 계산 (반응 속도 기반 1~5점) ---------- */
  function calcPoints(elapsedSec) {
    if (elapsedSec < 1.5) return 5;
    if (elapsedSec < 2.5) return 4;
    if (elapsedSec < 3.5) return 3;
    if (elapsedSec < 5.0) return 2;
    return 1;
  }

  /* ---------- 클릭 처리 ---------- */
  function handleOrganClick(organId) {
    if (!playing || !current) return;
    var g = document.getElementById(organId);
    if (g.classList.contains('solved')) return; // 이미 맞힌 기관

    if (organId === current.organ.id) {
      var elapsed = (performance.now() - current.spawnTime) / 1000;
      var pts = calcPoints(elapsed);
      score += pts;
      g.classList.add('solved');
      flashOrgan(organId, 'flash-ok');
      showMsg('⭕ 정답! +' + pts + '점', '#69f0ae');
      removeWord();
      updateHud();
      nextStep();
    } else {
      wrongCount++;
      flashOrgan(organId, 'flash-bad');
      if (wrongCount >= 3) {
        wrongCount = 0;
        lives--;
        showMsg('❌ 오답 3번! 💔 생명 -1', '#ff8a80');
        updateHud();
        if (lives <= 0) { endGame(); return; }
      } else {
        showMsg('❌ 오답! (' + wrongCount + '/3)', '#ff8a80');
        updateHud();
      }
    }
  }

  /* ---------- 시작 / 종료 ---------- */
  function startGame() {
    var nick = nickInput.value.trim();
    if (!nick) {
      alert('닉네임을 입력해 주세요!');
      nickInput.focus();
      return;
    }
    nickname = nick;
    score = 0; lives = 3; level = 1; wrongCount = 0;
    removeWord();
    startLevel();
    updateHud();
    overlay.classList.add('hidden');
    teacherPanel.classList.add('hidden');
    playing = true;
    lastTime = null;
    spawnWord();
    rafId = requestAnimationFrame(loop);
  }

  function endGame() {
    playing = false;
    cancelAnimationFrame(rafId);
    removeWord();
    ORGANS.forEach(function(o){
      document.getElementById(o.id).classList.remove('solved');
    });

    var list = loadRanking();
    var myTime = Date.now();
    list.push({ nick: nickname, score: score, level: level, time: myTime });
    list.sort(function(a,b){ return b.score - a.score || b.level - a.level || a.time - b.time; });
    if (list.length > 50) list = list.slice(0, 50);
    saveRanking(list);
    var myRank = list.findIndex(function(r){ return r.time === myTime; }) + 1;

    overlay.classList.remove('hidden');
    overlay.querySelector('h2').textContent = '게임 종료!';
    var p = overlay.querySelector('p');
    p.innerHTML =
      '<b>' + escapeHtml(nickname) + '</b>님의 결과<br>' +
      '최종 점수: <b style="color:#ffd54f;font-size:22px">' + score + '점</b> &nbsp; 도달 단계: ' + level + '단계<br>' +
      '전체 순위: <b style="color:#80d8ff;font-size:20px">' + myRank + '위</b>';
    renderRanking(rankBoxStart, myTime);
    startBtn.textContent = '다시 시작';
  }

  /* ---------- 이벤트 등록 ---------- */
  ORGANS.forEach(function(o) {
    var g = document.getElementById(o.id);
    g.addEventListener('click', function(e) {
      e.stopPropagation();
      handleOrganClick(o.id);
    });
  });
  startBtn.addEventListener('click', startGame);
  nickInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter') startGame();
  });
  teacherPw.addEventListener('keydown', function(e){
    if (e.key === 'Enter') teacherLoginBtn.click();
  });

  renderRanking(rankBoxStart);
})();
</script>
</body>
</html>
